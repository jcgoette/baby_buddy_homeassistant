name: pytest

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest

    services:
      babybuddy:
        image: linuxserver/babybuddy
        ports:
          - 8000:8000
        options: >- # Set health checks to wait until babybuddy has started
          --health-cmd "curl --fail http://localhost:8000"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Retrieve API Key
        run: |
          # Retrieve CSRF token
          csrf_token=$(curl -s -c cookies.txt 'http://localhost:8000/login/' | grep -oP 'name="csrfmiddlewaretoken" value="\K[^"]+')
          if [ -z "$csrf_token" ]; then
            echo "Failed to retrieve CSRF Token."
            exit 1
          fi

          # Login and get session
          login_response=$(curl -s 'http://localhost:8000/login/' \
          -b cookies.txt \
          -c cookies.txt \
          --data-raw "csrfmiddlewaretoken=${csrf_token}&username=admin&password=admin&login=")

          # Retrieve API key
          api_key=$(curl -s 'http://localhost:8000/api/profile' \
          -b cookies.txt \
          | jq -r '.api_key')

          if [ -z "$api_key" ]; then
            echo "Failed to retrieve API Key."
            exit 1
          fi

          # Set API key in GitHub environment
          echo "api_key=$api_key" >> $GITHUB_ENV

      - name: Seed a placeholder child
        run: |
          # A freshly started babybuddy container has no children, so the
          # coordinator's first refresh fails with "No children found" and
          # the config entry never reaches LOADED (tests/test_config_flow.py
          # asserts this). The test suite creates its own "lorem"/"ipsum"
          # child later via the add_child service; this one only exists to
          # satisfy that first check.
          curl -sf 'http://localhost:8000/api/children/' \
            -H "Authorization: Token $api_key" \
            -H 'Content-Type: application/json' \
            -d "{\"first_name\":\"ci\",\"last_name\":\"placeholder\",\"birth_date\":\"$(date -I)\"}"
        env:
          api_key: ${{ env.api_key }}

      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip

      - name: Install requirements
        run: python3 -m pip install -r requirements-test.txt

      - name: Run tests
        env:
          BABY_BUDDY_HOST: http://127.0.0.1
          BABY_BUDDY_PORT: 8000
          API_KEY: ${{ env.api_key }}
        run: |
          pytest --maxfail=1 --cov=custom_components/babybuddy --cov-report=term-missing
