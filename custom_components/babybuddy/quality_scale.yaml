# https://developers.home-assistant.io/docs/core/integration-quality-scale/
# https://github.com/home-assistant/core/blob/dev/script/scaffold/templates/integration/integration/quality_scale.yaml
rules:
  # Bronze
  action-setup: done # Registered in async_setup (init.py:16)
  appropriate-polling: done # Scan interval configurable via options (coordinator.py:64) with 60s default (const.py:23)
  brands: done # Assets available in home-assistant/brands
  common-modules: done # Base classes like BabyBuddySensor centralize device info logic (entity.py:38)
  config-flow-test-coverage: todo
  config-flow: todo
  dependency-transparency: todo
  docs-actions: done # Documented in README.md under Services
  docs-conditions: todo
  docs-high-level-description: done # Documented in README.md
  docs-installation-instructions: done # Documented in README.md under Installation
  docs-removal-instructions: todo # Add instructions for HACS removal
  docs-triggers: todo
  entity-event-setup: todo
  entity-unique-id: done # Unique IDs defined in entity.py:81
  has-entity-name: todo
  runtime-data: done # Uses ConfigEntry.runtime_data (init.py:28)
  test-before-configure: todo
  test-before-setup: todo
  unique-config-entry: done # Config flow handles unique IDs (config_flow.py:73,116)

  # Silver
  action-exceptions: todo
  config-entry-unloading: done # Implemented async_unload_entry (init.py:44)
  docs-configuration-parameters: done # Documented in README.md under Configuration
  docs-installation-parameters: done # Documented in README.md under Configuration
  entity-unavailable: todo
  integration-owner: done # Defined in manifest.json
  log-when-unavailable: todo
  parallel-updates: todo
  reauthentication-flow: todo
  test-coverage: todo

  # Gold
  devices: done # Creates devices for children (entity.py:63,208)
  diagnostics: done # Implemented in diagnostics.py
  discovery-update-info: todo
  discovery: todo
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices: todo
  entity-category: todo
  entity-device-class: todo
  entity-disabled-by-default: todo
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices: todo

  # Platinum
  async-dependency: todo
  inject-websession: todo
  strict-typing: todo